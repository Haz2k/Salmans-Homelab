---
all:
  children:
    proxmox_nodes:
      hosts:
        pve1:
          ansible_host: 192.168.0.100  # pve1 — main server
        pve2:
          ansible_host: 192.168.0.150  # pve2
    qdevice:
      hosts:
        pi-qdevice:
          ansible_host: 192.168.0.199  # Pi — reserve this via DHCP reservation in router
          ansible_user: salman

  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_python_interpreter: /usr/bin/python3
