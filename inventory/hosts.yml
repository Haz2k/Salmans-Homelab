---
all:
  children:
    proxmox_nodes:
      vars:
        sshd_root_login: prohibit-password   # keep key-only root SSH between nodes
        sshd_allow_users: "ansible root@192.168.0.100 root@192.168.0.150"
        firewall_extra_udp_ports: ["5405:5412"]   # corosync
      hosts:
        pve1:
          ansible_host: 192.168.0.100  # pve1 — main server
        pve2:
          ansible_host: 192.168.0.150  # pve2
    qdevice:
      hosts:
        pi-qdevice:
          ansible_host: 192.168.0.199  # Pi — reserve this via DHCP reservation in router
          ansible_user: salman
          sshd_allow_users: salman
          firewall_extra_tcp_ports: ["5403"]   # corosync-qnetd (QDevice vote)
    lxc_hosts:
          hosts:
            pihole:
              ansible_host: 192.168.0.4
              ansible_user: root
            core_stack:
              ansible_host: 192.168.0.5
              ansible_user: root
            monitoring_stack:
              ansible_host: 192.168.0.7
              ansible_user: root
              dockhand_port: 3005
            automation_stack:
              ansible_host: 192.168.0.8
              ansible_user: root
            receipts_stack:
              ansible_host: 192.168.0.9
              ansible_user: root
            photos_stack:
              ansible_host: 192.168.0.10
              ansible_user: root
            sandbox:
              ansible_host: 192.168.0.11
              ansible_user: root
            ansible_control:
              ansible_host: 192.168.0.3
              ansible_user: root
  vars:
    ansible_user: ansible
    ansible_become: true
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_python_interpreter: /usr/bin/python3
