---
# proxmox_lxc_provision
#
# Creates one LXC per entry in group_vars/all/main.yml -> lxc_services by running
# `pct create` ON the target Proxmox node (as root via sudo). This avoids the
# Proxmox API-token restriction entirely ("Only root can pass arbitrary
# filesystem paths") and needs no root API token or python proxmoxer.
# Existing CTs are detected by their config file and left completely alone.
# Run from the control node; each task is delegated to the CT's own node.

- name: Check which containers already exist
  become: true
  ansible.builtin.stat:
    path: "/etc/pve/nodes/{{ item.value.node }}/lxc/{{ item.value.ctid }}.conf"
  register: lxc_conf
  loop: "{{ lxc_services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  tags: &lxc_tags [pihole, core_stack, monitoring_stack, automation_stack, receipts_stack, photos_stack, sandbox]

- name: Put the control node's public key on each node that needs a new CT
  ansible.builtin.copy:
    content: "{{ lxc_root_pubkey | default(lookup('ansible.builtin.file', '~/.ssh/id_ed25519.pub')) }}\n"
    dest: /root/.lxc_root_pubkey.pub
    owner: root
    mode: "0600"
  delegate_to: "{{ item.item.value.node }}"
  become: true
  when: not item.stat.exists
  loop: "{{ lxc_conf.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  tags: *lxc_tags

- name: Make sure the Debian 12 template is on the node
  ansible.builtin.command:
    cmd: "pveam download local {{ lxc_template }}"
    creates: "/var/lib/vz/template/cache/{{ lxc_template }}"
  delegate_to: "{{ item.item.value.node }}"
  become: true
  when: not item.stat.exists
  loop: "{{ lxc_conf.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  tags: *lxc_tags

- name: Create and start the missing containers
  ansible.builtin.command:
    argv:
      - pct
      - create
      - "{{ item.item.value.ctid }}"
      - "local:vztmpl/{{ lxc_template }}"
      - --hostname
      - "{{ item.item.key | replace('_', '-') }}"
      - --cores
      - "{{ item.item.value.cores }}"
      - --memory
      - "{{ item.item.value.memory }}"
      - --rootfs
      - "local-lvm:{{ (item.item.value.disk | default('20G')) | string | regex_replace('G$', '') }}"
      - --net0
      - "name=eth0,bridge=vmbr0,ip={{ item.item.value.ip }}/24,gw={{ lxc_gateway }}"
      - --features
      - nesting=1
      - --unprivileged
      - "1"
      - --onboot
      - "1"
      - --ssh-public-keys
      - /root/.lxc_root_pubkey.pub
      - --start
      - "1"
  delegate_to: "{{ item.item.value.node }}"
  become: true
  when: not item.stat.exists
  loop: "{{ lxc_conf.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  tags: *lxc_tags

- name: Create host folders that containers bind-mount (owner only where set)
  ansible.builtin.file:
    path: "{{ item.1.path }}"
    state: directory
    owner: "{{ item.1.owner | default(omit) }}"
    group: "{{ item.1.owner | default(omit) }}"
  delegate_to: "{{ item.0.value.node }}"
  become: true
  loop: "{{ lxc_services | dict2items | subelements('value.host_dirs', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.key }}: {{ item.1.path }}"
  tags: *lxc_tags

- name: Reconcile bind mounts and device passthrough (reboots a CT only if something was missing)
  ansible.builtin.shell: |
    set -e
    conf=$(pct config {{ item.value.ctid }})
    changed=0
    {% for m in item.value.mounts | default([]) %}
    echo "$conf" | grep -qF "mp{{ m.slot }}: {{ m.host }},mp={{ m.ct }}" || { pct set {{ item.value.ctid }} --mp{{ m.slot }} {{ m.host }},mp={{ m.ct }}; changed=1; }
    {% endfor %}
    {% for d in item.value.devices | default([]) %}
    echo "$conf" | grep -qF "dev{{ d.slot }}: {{ d.path }},gid={{ d.gid }}" || { pct set {{ item.value.ctid }} --dev{{ d.slot }} {{ d.path }},gid={{ d.gid }}; changed=1; }
    {% endfor %}
    if [ "$changed" = 1 ]; then pct reboot {{ item.value.ctid }} || pct start {{ item.value.ctid }}; echo RECONCILED; fi
  args:
    executable: /bin/bash
  delegate_to: "{{ item.value.node }}"
  become: true
  register: lxc_reconcile
  changed_when: "'RECONCILED' in lxc_reconcile.stdout"
  when: item.value.mounts is defined or item.value.devices is defined
  loop: "{{ lxc_services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  tags: *lxc_tags

- name: Wait for SSH on the new containers
  ansible.builtin.wait_for:
    host: "{{ item.item.value.ip }}"
    port: 22
    delay: 5
    timeout: 180
  delegate_to: localhost
  become: false
  when: not item.stat.exists
  loop: "{{ lxc_conf.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  tags: *lxc_tags
