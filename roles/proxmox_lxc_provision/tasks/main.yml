---
# proxmox_lxc_provision
#
# Creates one LXC per entry in group_vars/all.yml -> lxc_services, using
# the community.proxmox.proxmox module (see requirements.yml for the
# collection). Docs:
# https://docs.ansible.com/ansible/latest/collections/community/general/proxmox_module.html

- name: Ensure proxmoxer Python library is installed (required by the module)
  ansible.builtin.apt:
    name: python3-proxmoxer
    state: present

- name: Create LXC containers for each service stack
  community.proxmox.proxmox:
    api_user: "{{ vault_proxmox_api_user }}"
    api_token_id: "{{ vault_proxmox_api_token_id }}"
    api_token_secret: "{{ vault_proxmox_api_token_secret }}"
    api_host: "{{ vault_proxmox_api_host }}"
    validate_certs: false
    node: "{{ item.value.node }}"
    vmid: "{{ item.value.ctid }}"
    hostname: "{{ item.key | replace('_', '-') }}"
    ostemplate: "local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst"
    storage: local-lvm
    cmode: shell
    features: nesting=1
    cores: "{{ item.value.cores }}"
    disk: "{{ item.value.disk | default('20G') }}"
    memory: "{{ item.value.memory }}"
    netif:
      net0: "name=eth0,bridge=vmbr0,ip={{ item.value.ip }}/24,gw=192.168.0.1"
    unprivileged: true
    state: present
  loop: "{{ lxc_services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Add TUN cgroup + mount entries for media_stack LXC (Gluetun requires /dev/net/tun)
  ansible.builtin.lineinfile:
    path: "/etc/pve/nodes/{{ lxc_services.media_stack.node }}/lxc/{{ lxc_services.media_stack.ctid }}.conf"
    line: "{{ item }}"
    create: false
  loop:
    - "lxc.cgroup2.devices.allow: c 10:200 rwm"
    - "lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file"
  register: tun_conf_result

- name: Reboot media_stack LXC if TUN config changed
  ansible.builtin.command: "pct reboot {{ lxc_services.media_stack.ctid }}"
  delegate_to: "{{ lxc_services.media_stack.node }}"
  when: tun_conf_result.results | selectattr('changed') | list | length > 0

# NOTE: API token vars (vault_proxmox_api_*) live in group_vars/all/vault.yml,
# encrypted with Ansible Vault. Create the token in Proxmox first:
# Datacenter -> Permissions -> API Tokens, scoped to what Ansible needs.
