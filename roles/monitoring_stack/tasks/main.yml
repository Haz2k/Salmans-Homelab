---
# monitoring_stack — Prometheus, Grafana, node_exporter, pve_exporter,
# cadvisor, Scrutiny, Uptime Kuma, Speedtest Tracker, Homepage.
#
# Sourcing:
#   Prometheus:  https://prometheus.io/docs/prometheus/latest/installation/
#   Grafana:     https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
#   node_exporter: https://github.com/prometheus/node_exporter
#   pve_exporter:  https://github.com/prometheus-pve/prometheus-pve-exporter
#   cadvisor:    https://github.com/google/cadvisor
#   Scrutiny:    https://github.com/AnalogJ/scrutiny
#   Uptime Kuma: https://github.com/louislam/uptime-kuma (Docker section
#                in README)
#   Speedtest Tracker: https://docs.speedtest-tracker.dev/getting-started/installation
#   Homepage:    https://gethomepage.dev/installation/docker/
#   Grafana provisioning: https://grafana.com/docs/grafana/latest/administration/provisioning/

- name: Create monitoring_stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/monitoring_stack
    - /opt/monitoring_stack/prometheus
    - /opt/monitoring_stack/prometheus/data
    - /opt/monitoring_stack/grafana
    - /opt/monitoring_stack/grafana-provisioning/datasources
    - /opt/monitoring_stack/grafana-provisioning/dashboards
    - /opt/monitoring_stack/grafana-dashboards
    - /opt/monitoring_stack/pve_exporter
    - /opt/monitoring_stack/homepage

# Grafana (UID/GID 472) and Prometheus (UID/GID 65534 = nobody) run as
# non-root inside their containers and can't write to bind-mounted host
# folders owned by root by default. Fix ownership before the stack starts
# so this doesn't need a manual chown on every rebuild.
- name: Set ownership for Grafana data directory
  ansible.builtin.file:
    path: /opt/monitoring_stack/grafana
    owner: "472"
    group: "472"
    recurse: true

- name: Set ownership for Prometheus data directory
  ansible.builtin.file:
    path: /opt/monitoring_stack/prometheus/data
    owner: "65534"
    group: "65534"
    recurse: true

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/monitoring_stack/docker-compose.yml
    mode: "0644"

- name: Template prometheus.yml
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /opt/monitoring_stack/prometheus/prometheus.yml
    mode: "0644"

- name: Template pve_exporter config
  ansible.builtin.template:
    src: pve.yml.j2
    dest: /opt/monitoring_stack/pve_exporter/pve.yml
    mode: "0644"

- name: Template Grafana datasource provisioning
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: /opt/monitoring_stack/grafana-provisioning/datasources/datasource.yml
    mode: "0644"

- name: Template Grafana dashboard provider config
  ansible.builtin.template:
    src: grafana-dashboard-provider.yml.j2
    dest: /opt/monitoring_stack/grafana-provisioning/dashboards/provider.yml
    mode: "0644"

# Download well-known community dashboards directly by ID from grafana.com,
# so real dashboards exist on first boot with no manual import required.
- name: Download Grafana community dashboards
  ansible.builtin.get_url:
    url: "https://grafana.com/api/dashboards/{{ item.id }}/revisions/latest/download"
    dest: "/opt/monitoring_stack/grafana-dashboards/{{ item.name }}.json"
    mode: "0644"
  loop:
    - { id: 1860, name: "node-exporter-full" }
    - { id: 10347, name: "proxmox-via-prometheus" }
    - { id: 15798, name: "docker-monitoring-cadvisor" }
    - { id: 3662, name: "prometheus-2-0-overview" }

- name: Template Homepage services.yaml
  ansible.builtin.template:
    src: homepage-services.yaml.j2
    dest: /opt/monitoring_stack/homepage/services.yaml
    mode: "0644"

- name: Template Homepage settings.yaml
  ansible.builtin.template:
    src: homepage-settings.yaml.j2
    dest: /opt/monitoring_stack/homepage/settings.yaml
    mode: "0644"

- name: Start monitoring_stack
  community.docker.docker_compose_v2:
    project_src: /opt/monitoring_stack
    state: present
