---
# monitoring_stack — Prometheus, Grafana, node_exporter, pve_exporter,
# cadvisor, Scrutiny, Uptime Kuma, Speedtest Tracker.
#
# Sourcing:
#   Prometheus:  https://prometheus.io/docs/prometheus/latest/installation/
#   Grafana:     https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
#   node_exporter: https://github.com/prometheus/node_exporter
#   pve_exporter:  https://github.com/prometheus-pve/prometheus-pve-exporter
#   cadvisor:    https://github.com/google/cadvisor
#   Scrutiny:    https://github.com/AnalogJ/scrutiny
#   Uptime Kuma: https://github.com/louislam/uptime-kuma (Docker section
#                in README)
#   Speedtest Tracker: https://docs.speedtest-tracker.dev/getting-started/installation

- name: Create monitoring_stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/monitoring_stack
    - /opt/monitoring_stack/prometheus
    - /opt/monitoring_stack/prometheus/data
    - /opt/monitoring_stack/grafana
    - /opt/monitoring_stack/pve_exporter

# Grafana (UID/GID 472) and Prometheus (UID/GID 65534 = nobody) run as
# non-root inside their containers and can't write to bind-mounted host
# folders owned by root by default. Fix ownership before the stack starts
# so this doesn't need a manual chown on every rebuild.
- name: Set ownership for Grafana data directory
  ansible.builtin.file:
    path: /opt/monitoring_stack/grafana
    owner: "472"
    group: "472"
    recurse: true

- name: Set ownership for Prometheus data directory
  ansible.builtin.file:
    path: /opt/monitoring_stack/prometheus/data
    owner: "65534"
    group: "65534"
    recurse: true

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/monitoring_stack/docker-compose.yml
    mode: "0644"

- name: Template prometheus.yml
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /opt/monitoring_stack/prometheus/prometheus.yml
    mode: "0644"

- name: Template pve_exporter config
  ansible.builtin.template:
    src: pve.yml.j2
    dest: /opt/monitoring_stack/pve_exporter/pve.yml
    mode: "0644"

- name: Start monitoring_stack
  community.docker.docker_compose_v2:
    project_src: /opt/monitoring_stack
    state: present
