---
# core_stack — Authelia, Vaultwarden, DuckDNS.
#
# Sourcing:
#   Authelia:   https://www.authelia.com/integration/deployment/docker/
#   Vaultwarden: https://github.com/dani-garcia/vaultwarden (no separate
#                official site — README is the primary doc)
#   DuckDNS:    https://www.duckdns.org/install.jsp (Docker section)

- name: Create core_stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/core_stack
    - /opt/core_stack/authelia

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/core_stack/docker-compose.yml
    mode: "0644"

- name: Template Authelia configuration.yml
  ansible.builtin.template:
    src: authelia-configuration.yml.j2
    dest: /opt/core_stack/authelia/configuration.yml
    mode: "0644"

- name: Template Authelia users_database.yml
  ansible.builtin.template:
    src: authelia-users_database.yml.j2
    dest: /opt/core_stack/authelia/users_database.yml
    mode: "0600"

- name: Start core_stack
  community.docker.docker_compose_v2:
    project_src: /opt/core_stack
    state: present
