---
# traefik
#
# Config-as-code reverse proxy, replacing NPM. Compose file + static/dynamic
# config are templated from Traefik's own official docs:
# https://doc.traefik.io/traefik/getting-started/install-traefik/
# (Docker Compose section) — GitHub used only if docs are missing something:
# https://github.com/traefik/traefik

- name: Create traefik directory structure
  ansible.builtin.file:
    path: "/opt/traefik/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ""
    - dynamic

- name: Ensure acme.json exists with correct permissions (Traefik refuses to start otherwise, and Docker will bind-mount it as a directory if it doesn't exist first)
  ansible.builtin.file:
    path: /opt/traefik/acme.json
    state: touch
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: Template traefik static config
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: /opt/traefik/traefik.yml
    mode: "0644"

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/traefik/docker-compose.yml
    mode: "0644"

- name: Start traefik
  community.docker.docker_compose_v2:
    project_src: /opt/traefik
    state: present
