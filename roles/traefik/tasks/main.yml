---
# traefik
#
# Config-as-code reverse proxy, replacing NPM. Compose file + static/dynamic
# config are templated from Traefik's own official docs:
# https://doc.traefik.io/traefik/getting-started/install-traefik/
# (Docker Compose section) — GitHub used only if docs are missing something:
# https://github.com/traefik/traefik

- name: Create traefik directory structure
  ansible.builtin.file:
    path: "/opt/traefik/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ""
    - dynamic

- name: Ensure acme.json exists with correct permissions (Traefik refuses to start otherwise, and Docker will bind-mount it as a directory if it doesn't exist first)
  ansible.builtin.file:
    path: /opt/traefik/acme.json
    state: touch
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: Template traefik static config
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: /opt/traefik/traefik.yml
    mode: "0644"

- name: Template dynamic config for monitoring_stack routing
  ansible.builtin.template:
    src: dynamic/monitoring_stack.yml.j2
    dest: /opt/traefik/dynamic/monitoring_stack.yml
    mode: "0644"

- name: Template dynamic config for automation_stack routing
  ansible.builtin.template:
    src: dynamic/automation_stack.yml.j2
    dest: /opt/traefik/dynamic/automation_stack.yml
    mode: "0644"

- name: Template dynamic config for receipts_stack routing
  ansible.builtin.template:
    src: dynamic/receipts_stack.yml.j2
    dest: /opt/traefik/dynamic/receipts_stack.yml
    mode: "0644"

- name: Template dynamic config for dockhand routing
  ansible.builtin.template:
    src: dynamic/dockhand.yml.j2
    dest: /opt/traefik/dynamic/dockhand.yml
    mode: "0644"

- name: Template dynamic config for photos_stack (Immich) routing
  ansible.builtin.template:
    src: dynamic/photos_stack.yml.j2
    dest: /opt/traefik/dynamic/photos_stack.yml
    mode: "0644"

- name: Template dynamic config for nextcloud routing
  ansible.builtin.template:
    src: dynamic/nextcloud.yml.j2
    dest: /opt/traefik/dynamic/nextcloud.yml
    mode: "0644"

- name: Template dynamic config for frigate routing
  ansible.builtin.template:
    src: dynamic/frigate.yml.j2
    dest: /opt/traefik/dynamic/frigate.yml
    mode: "0644"

- name: Template dynamic config for admin tools (LAN-only)
  ansible.builtin.template:
    src: dynamic/admin_services.yml.j2
    dest: /opt/traefik/dynamic/admin_services.yml
    mode: "0644"

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/traefik/docker-compose.yml
    mode: "0644"

- name: Start traefik
  community.docker.docker_compose_v2:
    project_src: /opt/traefik
    state: present
