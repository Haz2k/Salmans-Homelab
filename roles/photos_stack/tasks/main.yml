---
# photos_stack — Immich with the existing photo library and database dump.
#
# FIRST INSTALL ONLY. Safe to re-run (every step checks first), but day-2
# updates are done from Dockhand / Immich itself, not from here.
#
# Needs: host_vars/photos_stack/vault.yml  ->  vault_immich_db_password
# (generated by a command that never prints the password; see the setup notes).

- name: Read the CT's current Proxmox config
  ansible.builtin.command: "pct config {{ lxc_services.photos_stack.ctid }}"
  delegate_to: "{{ lxc_services.photos_stack.node }}"
  become: true
  register: photos_pct_config
  changed_when: false

- name: Bind-mount the existing Immich uploads folder into the CT
  ansible.builtin.command: >-
    pct set {{ lxc_services.photos_stack.ctid }}
    -mp0 {{ immich_host_uploads }},mp={{ immich_uploads_mount }}
  delegate_to: "{{ lxc_services.photos_stack.node }}"
  become: true
  when: "'mp0:' not in photos_pct_config.stdout"
  register: photos_mount

- name: Reboot the CT so the mount appears
  ansible.builtin.command: "pct reboot {{ lxc_services.photos_stack.ctid }}"
  delegate_to: "{{ lxc_services.photos_stack.node }}"
  become: true
  when: photos_mount is changed

- name: Wait for the CT to come back
  when: photos_mount is changed
  block:
    - name: Drop the old SSH connection
      ansible.builtin.meta: reset_connection
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        delay: 15
        timeout: 240

- name: Check the uploads folder is mounted and looks like Immich data
  ansible.builtin.stat:
    path: "{{ immich_uploads_mount }}/library"
  register: photos_library

- name: Stop here if the photo folder is not there
  ansible.builtin.assert:
    that: photos_library.stat.exists and photos_library.stat.isdir
    fail_msg: >-
      {{ immich_uploads_mount }}/library is missing. Check the bind mount
      (pct config {{ lxc_services.photos_stack.ctid }}) and that
      {{ immich_host_uploads }} exists on the node.

- name: Create the stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/photos_stack
    - /opt/photos_stack/postgres

- name: Template the compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/photos_stack/docker-compose.yml
    mode: "0644"
    force: false     # never overwrite once Dockhand/you manage it

- name: Template the .env file (contains the DB password)
  ansible.builtin.template:
    src: env.j2
    dest: /opt/photos_stack/.env
    mode: "0600"
    force: false
  no_log: true

- name: Start only the database
  community.docker.docker_compose_v2:
    project_src: /opt/photos_stack
    services: [database]
    state: present

- name: Wait until Postgres accepts connections
  ansible.builtin.command: "docker exec immich_postgres pg_isready -U {{ immich_db_user }}"
  register: photos_pg_ready
  until: photos_pg_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: Restore the Immich database from the dump (first install only)
  ansible.builtin.shell: |
    set -o pipefail
    gunzip --stdout "{{ immich_restore_dump }}" \
      | sed "s/SELECT pg_catalog.set_config('search_path', '', false);/SELECT pg_catalog.set_config('search_path', 'public, pg_catalog', true);/g" \
      | docker exec -i immich_postgres psql --dbname=postgres --username={{ immich_db_user }}
    touch /opt/photos_stack/.db_restored
  args:
    executable: /bin/bash
    creates: /opt/photos_stack/.db_restored
  when: immich_restore_dump | length > 0
  register: photos_restore

- name: Set the DB password to the one in .env (the dump carries the old one)
  ansible.builtin.command: >-
    docker exec immich_postgres psql -U {{ immich_db_user }} -d postgres
    -c "ALTER USER {{ immich_db_user }} WITH PASSWORD '{{ vault_immich_db_password }}'"
  when: photos_restore is changed
  no_log: true

- name: Check the restored library has assets in it
  ansible.builtin.command: >-
    docker exec immich_postgres psql -U {{ immich_db_user }} -d {{ immich_db_name }}
    -tAc "select count(*) from asset"
  register: photos_asset_count
  changed_when: false
  when: immich_restore_dump | length > 0
  failed_when: photos_asset_count.rc != 0 or (photos_asset_count.stdout | trim | int) == 0

- name: Show how many assets were restored
  ansible.builtin.debug:
    msg: "{{ photos_asset_count.stdout | trim }} assets in the restored database"
  when: photos_asset_count is not skipped

- name: Start the whole Immich stack
  community.docker.docker_compose_v2:
    project_src: /opt/photos_stack
    state: present

- name: Wait for the Immich API
  ansible.builtin.uri:
    url: "http://localhost:2283/api/server/ping"
  register: photos_ping
  until: photos_ping.status == 200
  retries: 36
  delay: 10
