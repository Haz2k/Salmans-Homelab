---
# scrutiny_collector: sends S.M.A.R.T. data from this Proxmox node's real disks
# to the Scrutiny web page on CT104 (hub/spoke, binary collector, no Docker).
# Docs: https://github.com/AnalogJ/scrutiny/blob/master/docs/INSTALL_HUB_SPOKE.md
- name: Install smartmontools
  ansible.builtin.apt:
    name: smartmontools
    state: present

- name: Create scrutiny directories
  ansible.builtin.file:
    path: "/opt/scrutiny/{{ item }}"
    state: directory
    mode: "0755"
  loop: [bin, config]

- name: Download the collector binary
  ansible.builtin.get_url:
    url: "https://github.com/AnalogJ/scrutiny/releases/download/{{ scrutiny_collector_version }}/scrutiny-collector-metrics-linux-amd64"
    dest: /opt/scrutiny/bin/scrutiny-collector-metrics-linux-amd64
    mode: "0755"

- name: Template collector config (host name = node name)
  ansible.builtin.template:
    src: collector.yaml.j2
    dest: /opt/scrutiny/config/collector.yaml
    mode: "0644"

- name: Run the collector every 6 hours
  ansible.builtin.cron:
    name: scrutiny-collector
    minute: "17"
    hour: "*/6"
    job: "/opt/scrutiny/bin/scrutiny-collector-metrics-linux-amd64 run --config /opt/scrutiny/config/collector.yaml >/dev/null 2>&1"

- name: First run now so the dashboard fills in
  ansible.builtin.command:
    cmd: /opt/scrutiny/bin/scrutiny-collector-metrics-linux-amd64 run --config /opt/scrutiny/config/collector.yaml
  changed_when: false
