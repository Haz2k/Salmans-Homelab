---
# security_baseline
#
# Prefer well-known Galaxy roles over hand-rolled tasks here (see
# requirements.yml): geerlingguy.security, geerlingguy.firewall,
# willshersystems.sshd. This file just wires them together with the
# homelab-specific settings.

# Raspberry Pi OS ships a cloud-init drop-in that sets PasswordAuthentication yes.
# sshd uses the FIRST value it sees and the drop-in is included first, so it
# silently overrides our hardening. Remove it (no-op on hosts without it).
- name: Remove cloud-init sshd drop-in that re-enables password login
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    state: absent
  register: security_baseline_cloudinit_dropin

- name: Apply SSH hardening (key-only, no root login)
  ansible.builtin.import_role:
    name: willshersystems.sshd
  vars:
    sshd_PasswordAuthentication: "no"
    # Overridable per host/group (inventory) so Proxmox nodes can keep
    # key-only root SSH between each other (needed for replication/migration).
    sshd_PermitRootLogin: "{{ sshd_root_login | default('no') }}"
    sshd_AllowUsers: "{{ sshd_allow_users | default(ansible_user) }}"

- name: Reload sshd if the drop-in was removed
  ansible.builtin.service:
    name: ssh
    state: reloaded
  when: security_baseline_cloudinit_dropin is changed

- name: Apply base OS security (fail2ban, auto-updates, etc.)
  ansible.builtin.import_role:
    name: geerlingguy.security

- name: Apply firewall baseline
  ansible.builtin.import_role:
    name: geerlingguy.firewall
  vars:
    # Base ports + per-group extras. The QDevice Pi MUST allow TCP 5403 or the
    # cluster loses its tie-breaker vote (inventory: firewall_extra_tcp_ports).
    firewall_allowed_tcp_ports: "{{ ['22', '8006'] + (firewall_extra_tcp_ports | default([])) }}"
    firewall_allowed_udp_ports: "{{ firewall_extra_udp_ports | default([]) }}"

# TODO once at home base:
# - Proxmox UI 2FA (TOTP) is configured manually in the web UI, not via
#   Ansible — Proxmox doesn't expose this via API in a clean idempotent way.
# - Confirm Proxmox UI port 8006 is only reachable via Tailscale, not LAN/WAN.
