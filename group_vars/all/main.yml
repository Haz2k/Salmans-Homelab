---
# Non-secret shared variables. Secrets go in group_vars/all/vault.yml
# (Ansible Vault encrypted — created separately, not in this scaffold).

lxc_template: debian-12-standard_12.12-1_amd64.tar.zst
lxc_gateway: 192.168.0.1
# One LXC per grouped stack (see roles/*_stack). Pi-hole is intentionally
# kept on its own LXC, outside Docker, for DNS isolation.
lxc_services:
  pihole:
    ctid: 101
    ip: 192.168.0.4
    cores: 1
    memory: 512
    node: pve1

  core_stack:
    ctid: 102
    ip: 192.168.0.5
    cores: 2
    memory: 2048
    node: pve1
    apps: [nginx_proxy_manager_replaced_by_traefik, authelia, vaultwarden, duckdns]

  monitoring_stack:
    ctid: 104
    ip: 192.168.0.7
    cores: 2
    memory: 2048
    node: pve1
    apps: [prometheus, grafana, node_exporter, pve_exporter, cadvisor, scrutiny, uptime_kuma, speedtest_tracker]

  automation_stack:
    ctid: 105
    ip: 192.168.0.8
    cores: 2
    memory: 2048
    node: pve2
    apps: [home_assistant, ollama, paperless_ngx]

  receipts_stack:
    ctid: 106
    ip: 192.168.0.9
    cores: 2
    memory: 2048
    node: pve2
    apps: [receipts]

  photos_stack:
    ctid: 107
    ip: 192.168.0.10
    cores: 4
    memory: 6144
    node: pve1
    apps: [immich]

  sandbox:
    ctid: 108
    ip: 192.168.0.11
    cores: 2
    memory: 3072
    disk: 30G
    node: pve1
    apps: [frigate, test_apps]  # managed from Dockhand, NOT by Ansible

  ansible_control:
    ctid: 100
    ip: 192.168.0.3
    cores: 2
    memory: 2048
    node: pve1
    apps: [semaphore, diun]

# Reverse proxy
traefik_ip: "{{ lxc_services.core_stack.ip }}"

# ZFS replication interval (minutes) between pve1 <-> pve2
zfs_replication_interval_min: 15
