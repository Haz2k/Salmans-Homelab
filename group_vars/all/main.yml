---
# Non-secret shared variables. Secrets go in group_vars/all/vault.yml
# (Ansible Vault encrypted — created separately, not in this scaffold).

lxc_template: debian-12-standard_12.12-1_amd64.tar.zst
lxc_gateway: 192.168.0.1
# One LXC per grouped stack (see roles/*_stack). Pi-hole is intentionally
# kept on its own LXC, outside Docker, for DNS isolation.
lxc_services:
  pihole:
    ctid: 101
    ip: 192.168.0.4
    cores: 1
    memory: 512
    disk: 8G
    node: pve1

  core_stack:
    ctid: 102
    ip: 192.168.0.5
    cores: 2
    memory: 2048
    disk: 12G
    node: pve1
    apps: [nginx_proxy_manager_replaced_by_traefik, authelia, vaultwarden, duckdns]

  monitoring_stack:
    ctid: 104
    ip: 192.168.0.7
    cores: 2
    memory: 2048
    disk: 19G
    node: pve1
    apps: [prometheus, grafana, node_exporter, pve_exporter, cadvisor, scrutiny, uptime_kuma, speedtest_tracker]

  automation_stack:
    ctid: 105
    ip: 192.168.0.8
    cores: 2
    memory: 2048
    disk: 30G
    node: pve2
    apps: [home_assistant, ollama, paperless_ngx]

  receipts_stack:
    ctid: 106
    ip: 192.168.0.9
    cores: 2
    memory: 2048
    disk: 20G
    node: pve2
    apps: [receipts]

  photos_stack:
    ctid: 107
    ip: 192.168.0.10
    cores: 4
    memory: 6144
    disk: 20G
    node: pve1
    apps: [immich, nextcloud]
    host_dirs:
      - { path: /mnt/pve/storage/immich/uploads }
      - { path: /mnt/pve/storage/nextcloud/data, owner: "100033" }
    mounts:
      - { slot: 0, host: /mnt/pve/storage/immich/uploads, ct: /mnt/immich/uploads }
      - { slot: 1, host: /mnt/pve/storage/nextcloud, ct: /mnt/nextcloud }

  sandbox:
    ctid: 108
    ip: 192.168.0.11
    cores: 2
    memory: 3072
    disk: 30G
    node: pve1
    apps: [frigate, test_apps]  # managed from Dockhand, NOT by Ansible
    host_dirs:
      - { path: /mnt/pve/storage/frigate, owner: "100000" }
    devices:
      - { slot: 0, path: /dev/dri/renderD128, gid: 104 }
    mounts:
      - { slot: 0, host: /mnt/pve/storage/frigate, ct: /media/frigate }

  ansible_control:
    ctid: 100
    ip: 192.168.0.3
    cores: 2
    memory: 2048
    disk: 12G
    node: pve1
    apps: [semaphore, diun]

# Reverse proxy
traefik_ip: "{{ lxc_services.core_stack.ip }}"

# ZFS replication interval (minutes) between pve1 <-> pve2
zfs_replication_interval_min: 15

# Image pins for the Dockhand/Hawser roles (tag is cosmetic once a digest is present)
dockhand_version: "latest@sha256:4fd64d32728c99e5caf39b952a17d85448ee0b8ae76e0961f719ba2e19013988"
hawser_version: "latest@sha256:bbeebc96c2d03b2721c6bfc88e1b250eb852c66ed3914335a6fe8ced4218f059"

# Extra firewall rules per host (raw iptables lines): NFS from pve1 only, for backups
firewall_extra_rules_by_host:
  pve2:
    - "iptables -A INPUT -p tcp --dport 2049 -s 192.168.0.100 -j ACCEPT"

# DNS handed to every CT: Pi-hole first, Cloudflare as fallback.
# Pi-hole itself uses public DNS so it never depends on itself.
lxc_dns: "192.168.0.4 1.1.1.1"
lxc_pihole_dns: "1.1.1.1 1.0.0.1"
