---
# Master playbook. Run the whole thing, or scope with --tags.
#
#   ansible-playbook site.yml --tags init      # bootstrap an empty environment
#   ansible-playbook site.yml --tags monitoring_stack  # rebuild just one stack
#
# FIRST INSTALL ONLY. After bootstrap, day-2 work happens in UIs:
#   Proxmox UI = CTs, Dockhand (:3001 on every CT) = containers,
#   Semaphore = OS patching (os_update.yml) + stack updates (update.yml).
#
# All runs need: --vault-password-file /path/to/.vault_pass (kept on the
# flash drive, never in this repo).

- name: Harden and baseline every Proxmox node + the Pi
  hosts: proxmox_nodes:qdevice
  become: true
  tags: [init, security_baseline]
  roles:
    - security_baseline

- name: Provision LXC containers on the Proxmox nodes
  hosts: pve1
  become: true
  tags: [init, provision]
  roles:
    - proxmox_lxc_provision

- name: Install Docker on the app-hosting LXCs
  hosts: lxc_hosts
  become: true
  tags: [init, docker, receipts_stack]
  roles:
    - docker

- name: Install the main Dockhand on CT100 (one UI for every CT)
  hosts: ansible_control
  become: true
  tags: [init, dockhand]
  roles:
    - dockhand

- name: Install Hawser agents on every other app LXC
  hosts: lxc_hosts:!ansible_control
  become: true
  tags: [init, hawser]
  roles:
    - hawser

- name: Deploy Pi-hole (standalone, not in a Docker stack)
  hosts: pihole
  become: true
  tags: [pihole]
  roles:
    - pihole

- name: Deploy Traefik (reverse proxy)
  hosts: core_stack
  become: true
  tags: [core_stack, traefik]
  roles:
    - traefik

- name: Deploy core stack (Authelia, Vaultwarden, DuckDNS)
  hosts: core_stack
  become: true
  tags: [core_stack]
  roles:
    - core_stack

- name: Deploy monitoring stack (Prometheus, Grafana, Scrutiny, Uptime Kuma)
  hosts: monitoring_stack
  become: true
  tags: [monitoring_stack]
  roles:
    - monitoring_stack

- name: Deploy automation stack (Home Assistant, Ollama, Paperless-NGX)
  hosts: automation_stack
  become: true
  tags: [automation_stack]
  roles:
    - automation_stack

- name: Configure ZFS replication + email alerts
  hosts: proxmox_nodes
  become: true
  tags: [zfs, monitoring_stack]
  roles:
    - zfs_alerts

- name: Deploy Semaphore (safe automated updates)
  hosts: ansible_control
  become: true
  tags: [init, semaphore]
  roles:
    - semaphore

- name: Deploy receipts stack (self-hosted receipt tracker)
  hosts: receipts_stack
  become: true
  tags: [receipts_stack]
  roles:
    - receipts_stack

- name: Deploy Immich (photos) with the existing library and database dump
  hosts: photos_stack
  become: true
  tags: [immich]
  roles:
    - photos_stack

- name: Backup target on pve2 (NFS export of the backup disk)
  hosts: pve2
  become: true
  tags: [backups]
  roles:
    - backups

- name: Backup storage, nightly jobs and photo copy (pve1)
  hosts: pve1
  become: true
  tags: [backups]
  roles:
    - backups

- name: Deploy Frigate (sandbox, test stream first)
  hosts: sandbox
  become: true
  tags: [frigate]
  roles:
    - frigate

- name: Deploy Nextcloud (photos_stack)
  hosts: photos_stack
  become: true
  tags: [nextcloud]
  roles:
    - nextcloud

- name: Scrutiny S.M.A.R.T. collector on the Proxmox nodes
  hosts: proxmox_nodes
  become: true
  tags: [scrutiny_collector]
  roles:
    - scrutiny_collector
